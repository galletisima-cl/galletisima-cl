<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dino Huevo</title>
<meta name="description" content="Juego para niños de 5 años: ayuda al bebé dino a nacer.">
<meta name="theme-color" content="#8fd8ff">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦕</text></svg>">
<style>
:root{--ink:#3b2a6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Baloo 2","Fredoka","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:linear-gradient(#8fd8ff 0%,#d9f6ff 58%,#fff3bf 100%)}
#app{position:fixed;inset:0;height:100dvh;overflow:hidden}
.sun{position:absolute;top:6vmin;right:9vmin;width:13vmin;height:13vmin;border-radius:50%;background:#ffe066;box-shadow:0 0 0 2vmin #ffe06655}
.cloud{position:absolute;font-size:11vmin;opacity:.92;left:-20vw;animation:drift 70s linear infinite}
.cloud.c2{top:22vmin;animation-duration:95s;animation-delay:-40s;font-size:8vmin}
.hill{position:absolute;border-radius:50%}
.h1{left:-15vw;bottom:-22vmin;width:75vw;height:44vmin;background:#7fd47f}
.h2{right:-20vw;bottom:-24vmin;width:90vw;height:50vmin;background:#5cc46b}
.h3{left:12vw;bottom:-20vmin;width:70vw;height:34vmin;background:#9be08b}
#hud{position:absolute;top:max(1.5vmin,env(safe-area-inset-top));left:2vmin;right:2vmin;display:flex;justify-content:space-between;z-index:5;pointer-events:none}
#hud .grp{display:flex;gap:1.5vmin}
#hud button{pointer-events:auto;width:clamp(46px,9vmin,70px);height:clamp(46px,9vmin,70px);border-radius:50%;border:0;background:#ffffffd0;font-size:clamp(22px,4.6vmin,36px);box-shadow:0 .6vmin 0 #0002;cursor:pointer;padding:0}
#hud button:active{transform:translateY(2px)}
#stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vmin;padding:max(11vmin,64px) 3vmin 3vmin;z-index:2}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.fxp{position:absolute;top:-10vmin;font-size:clamp(24px,6vmin,48px);animation:fall linear forwards}
.note{position:absolute;font-size:clamp(28px,7vmin,56px);animation:floatUp 1s ease-out forwards}

.bigbtn{width:clamp(88px,20vmin,150px);height:clamp(88px,20vmin,150px);border-radius:50%;border:0;font-size:clamp(44px,10vmin,76px);background:#fff;box-shadow:0 1.2vmin 0 #0002;cursor:pointer;padding:0;transition:transform .12s}
.bigbtn:active{transform:translateY(.8vmin) scale(.96)}
.bigbtn.ok{background:#7be08a}
.bigbtn.no{background:#ff9a9a}
.bigbtn.mic.listening{background:#ff7b7b;animation:pulse .9s infinite}
.row{display:flex;gap:5vmin;align-items:center;justify-content:center;flex-wrap:wrap}
.coach{width:min(52vmin,320px)}
.dino{width:100%;height:auto;overflow:visible}
.dino *{stroke:rgba(60,30,10,.18);stroke-width:3;stroke-linejoin:round}
.dino .nostroke,.dino .nostroke *{stroke:none}
.dino [data-part]{cursor:pointer}
.avimg{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none;filter:drop-shadow(0 1vmin 0 #0002)}
.bounce{animation:bounce 1.6s ease-in-out infinite}
.start .coach{width:min(60vmin,380px)}
.start .bigbtn{width:clamp(110px,24vmin,180px);height:clamp(110px,24vmin,180px);font-size:clamp(56px,13vmin,100px);background:#7be08a}
.tiles{display:flex;gap:1.5vmin;flex-wrap:wrap;justify-content:center}
.tile{min-width:clamp(48px,11vmin,90px);height:clamp(58px,13vmin,106px);padding:0 1vmin;display:grid;place-items:center;background:#fff;border-radius:2vmin;font-weight:900;font-size:clamp(34px,8vmin,70px);color:#ff6b3d;box-shadow:0 .8vmin 0 #0002}
.nameInput{width:min(80vw,520px);font-size:clamp(36px,9vmin,72px);font-family:inherit;font-weight:800;text-align:center;padding:1.5vmin 2vmin;border:.8vmin solid #fff;border-radius:3vmin;color:var(--ink);background:#fffffff0;outline:none;-webkit-user-select:text;user-select:text}
.nameInput:focus{border-color:#ffb830}
.nameInput.bad{animation:shake .4s}

.pickrow{display:grid;grid-template-columns:repeat(4,1fr);gap:2.5vmin;width:100%;max-width:1000px;align-items:center}
.pick{aspect-ratio:1;width:100%;height:auto;border:0;border-radius:8vmin;padding:1.6vmin;background:#ffffffd8;box-shadow:0 1.2vmin 0 #0002;cursor:pointer}
.pick:active{transform:translateY(.8vmin) scale(.96)}
.pick.good{animation:pop .6s;background:#d9ffd9}
@media (orientation:portrait){.pickrow{grid-template-columns:repeat(2,1fr);max-width:min(88vw,520px)}}

.bubble{background:#fff;border-radius:6vmin;padding:1.5vmin 5vmin;display:flex;align-items:center;gap:3vmin;box-shadow:0 1vmin 0 #0002;min-height:18vmin}
.bigLetter,.bigNum{font-size:clamp(60px,16vmin,150px);font-weight:900;line-height:1;color:#ff6b3d}
.emo{font-size:clamp(50px,13vmin,120px);min-width:1ch;line-height:1}
.dotsRow{font-size:clamp(26px,6vmin,56px);color:#ff9f43;letter-spacing:.1em}
.eggs{display:flex;gap:3vmin;flex-wrap:wrap;justify-content:center}
.egg{width:clamp(96px,26vmin,200px);aspect-ratio:4/5;border:0;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;font-family:inherit;font-weight:900;font-size:clamp(54px,14vmin,120px);line-height:1;color:var(--ink);cursor:pointer;box-shadow:inset -1.2vmin -1.5vmin 0 #0001,0 1.2vmin 0 #0002;transition:transform .15s;padding:0}
.egg:active{transform:scale(.94)}
.egg.good{animation:pop .6s}
.egg.bad{animation:shake .4s}
.egg.hint,.opt.hint,.cegg.hint{animation:pulse .8s infinite}
.pdots{display:flex;gap:1.5vmin;margin-top:1vmin}
.pdots i{width:2.4vmin;height:2.4vmin;border-radius:50%;background:#fff9;border:.4vmin solid #fff}
.pdots i.on{background:#ffb830}
.pdots i.cur{background:#fff;transform:scale(1.3)}

.map{display:flex;flex-direction:column;align-items:center;gap:3vmin}
.mapTop{display:flex;align-items:flex-end;justify-content:center;gap:3vmin}
.mapEgg{width:min(30vmin,220px)}
.mapEgg svg{width:100%;height:auto;display:block}
.mapAv{width:min(24vmin,170px);aspect-ratio:5/7}
.missions{display:flex;gap:2.5vmin;flex-wrap:wrap;justify-content:center;max-width:96vw}
.mis{position:relative;width:clamp(80px,17vmin,130px);height:clamp(80px,17vmin,130px);border-radius:50%;border:0;background:#fff;font-size:clamp(38px,8.5vmin,64px);font-weight:900;color:#ff6b3d;box-shadow:0 1vmin 0 #0002;cursor:pointer;padding:0;font-family:inherit}
.mis:active{transform:translateY(.6vmin)}
.mis.done{background:#d9ffd9;box-shadow:0 1vmin 0 #0001}
.mis .star{position:absolute;top:-1vmin;right:-1vmin;font-size:clamp(24px,5vmin,40px)}
.mis.m1{background:#ffe9a8}.mis.m2{background:#ffd0d0}.mis.m3{background:#d5ecff}.mis.m4{background:#e6d9ff}.mis.m5{background:#d0ffe6}
.mis.done{background:#d9ffd9}

.field{position:relative;flex:1;width:min(100%,900px);min-height:0}
.nest{position:absolute;left:50%;top:2%;transform:translateX(-50%);width:min(44vmin,300px)}
.nest svg{width:100%;height:auto;display:block}
.cegg{position:absolute;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;box-shadow:inset -.8vmin -1vmin 0 #0001,0 .8vmin 0 #0002;transition:left .45s cubic-bezier(.3,1.4,.5,1),top .45s cubic-bezier(.3,1.4,.5,1),opacity .4s;cursor:grab;touch-action:none}
.cegg::after{content:"";position:absolute;left:28%;top:22%;width:16%;height:12%;border-radius:50%;background:#fff9}
.cegg.drag{cursor:grabbing;z-index:5;transform:scale(1.08)}
.cegg.gone{opacity:0}

.paint{display:flex;flex-direction:column;align-items:center;gap:2vmin;flex:1;min-height:0;width:100%}
.paint .dino{width:min(62vmin,420px);max-height:100%}
.palette{display:flex;gap:2vmin;flex-wrap:wrap;justify-content:center}
.sw{width:clamp(48px,11vmin,84px);height:clamp(48px,11vmin,84px);border-radius:50%;border:.8vmin solid #fff;box-shadow:0 .8vmin 0 #0002;cursor:pointer;padding:0}
.sw.sel{transform:scale(1.2);border-color:#3b2a6b}
.paintpop{animation:pop .4s;transform-box:fill-box;transform-origin:center}

.seq{display:flex;gap:1.5vmin;justify-content:center;flex-wrap:wrap}
.cell{width:min(13.5vw,15vmin,120px);aspect-ratio:1;background:#fff;border-radius:2.5vmin;display:grid;place-items:center;box-shadow:0 .8vmin 0 #0002}
.cell.q{border:.8vmin dashed #ff9f43;color:#ff9f43;font-weight:900;font-size:clamp(34px,8vmin,64px);background:#fffc}
.foot{display:block}.foot.g{width:78%}.foot.p{width:44%}
.opts{display:flex;gap:3vmin;justify-content:center;flex-wrap:wrap}
.opt{width:clamp(90px,22vmin,170px);aspect-ratio:1;background:#fff;border:0;border-radius:4vmin;display:grid;place-items:center;box-shadow:0 1vmin 0 #0002;cursor:pointer;padding:0}
.opt:active{transform:scale(.94)}
.opt.bad{animation:shake .4s}
.opt.good{animation:pop .6s}

.stars{display:flex;gap:1.5vmin;font-size:clamp(24px,6vmin,48px)}
.stars span{filter:grayscale(1) opacity(.35);transition:filter .2s}
.stars span.on{filter:none;animation:pop .5s}
.dance{position:relative;flex:1;width:100%;display:grid;place-items:center;min-height:0}
.dance .dino{width:min(60vmin,400px);position:relative;z-index:1}
.dance .danceAv{width:min(46vmin,330px);height:min(60vmin,420px);position:relative;z-index:1}
.ring{position:absolute;left:50%;top:50%;width:min(60vmin,420px);aspect-ratio:1;margin:calc(min(60vmin,420px)/-2) 0 0 calc(min(60vmin,420px)/-2);border-radius:50%;border:1.4vmin solid #fffb;opacity:0}
.ring.b{animation:beat .5s ease-out}
.dL{animation:danceL .4s ease-out}
.dR{animation:danceR .4s ease-out}
.spin{animation:spin .9s ease-in-out}

.hatch{position:relative;display:flex;flex-direction:column;align-items:center;gap:1vmin}
.hatch .bigEgg{width:min(46vmin,320px)}
.hatch .bigEgg svg{width:100%;height:auto;display:block}
.hatch .wob{animation:wobble .5s ease-in-out infinite}
.baby{width:min(44vmin,300px);height:min(48vmin,340px)}
@media (orientation:landscape){.baby{width:min(30vmin,220px);height:min(34vmin,250px)}.shell{margin-top:-9vmin;width:min(36vmin,260px)}.hatch .bigEgg{width:min(38vmin,260px)}}
.shell{width:min(48vmin,330px);margin-top:-12vmin;position:relative;z-index:0}
.shell svg{width:100%;height:auto;display:block}
.baby,.shell{animation:popIn .7s cubic-bezier(.3,1.5,.5,1)}

.seedfield{position:relative;flex:1;width:min(100%,900px);min-height:0;overflow:hidden;touch-action:none}
.seed{position:absolute;top:0;animation:seedFall linear forwards;pointer-events:none}
.seedIn{width:100%;height:100%;transform-origin:50% 100%}
.seedIn svg{width:100%;height:100%;display:block;filter:drop-shadow(0 .8vmin 0 #0002)}
.seed.hit .seedIn{animation:splat .4s ease-out forwards}
@keyframes seedFall{from{transform:translateY(calc(var(--s) * -1.4))}to{transform:translateY(var(--h))}}
@keyframes splat{0%{transform:scale(1)}35%{transform:scale(1.5,.45)}100%{transform:scale(2.1,.1);opacity:0}}
@keyframes drift{to{transform:translateX(140vw)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25) rotate(-4deg)}100%{transform:scale(1)}}
@keyframes popIn{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-1.6vmin)}40%{transform:translateX(1.6vmin)}60%{transform:translateX(-1vmin)}80%{transform:translateX(1vmin)}}
@keyframes pulse{50%{transform:scale(1.1);box-shadow:0 0 0 1.6vmin #ffe066}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5vmin)}}
@keyframes wobble{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
@keyframes floatUp{0%{transform:translateY(0) scale(.6);opacity:1}100%{transform:translateY(-14vmin) scale(1.2);opacity:0}}
@keyframes beat{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.2);opacity:0}}
@keyframes danceL{0%{transform:rotate(0) translateY(0)}40%{transform:rotate(-9deg) translateY(-3vmin)}100%{transform:rotate(0) translateY(0)}}
@keyframes danceR{0%{transform:rotate(0) translateY(0)}40%{transform:rotate(9deg) translateY(-3vmin)}100%{transform:rotate(0) translateY(0)}}
@keyframes spin{to{transform:rotate(360deg) scale(1)}}
@media (prefers-reduced-motion:reduce){.cloud{animation:none}.bounce{animation:none}}
</style>
</head>
<body>
<noscript>Este juego necesita JavaScript.</noscript>
<div id="app">
  <div class="sun"></div>
  <div class="cloud">☁️</div><div class="cloud c2">☁️</div>
  <div class="hill h1"></div><div class="hill h3"></div><div class="hill h2"></div>
  <div id="hud">
    <div class="grp"><button id="btnHome" aria-label="Volver al mapa" hidden>🏠</button></div>
    <div class="grp">
      <button id="btnRepeat" aria-label="Escuchar otra vez" hidden>🔊</button>
      <button id="btnMusic" aria-label="Música sí o no">🎵</button>
    </div>
  </div>
  <div id="stage"></div>
  <div id="fx"></div>
</div>

<script>
'use strict';
/* =====================  utilidades  ===================== */
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const stage = $('#stage');
let token = 0, idleT = null, repeatFn = null, view = 'start';

const S = {
  name: 'Maxi', letters: lettersOf('Maxi'),
  av: 0,
  col: { body: '#5cc46b', belly: '#fff1b8', spikes: '#ff9f43' },
  done: [false, false, false, false, false],
  visited: false
};

/* =====================  audio (música + efectos)  ===================== */
const AC = window.AudioContext || window.webkitAudioContext;
let ctx = null, master, musicGain, sfxGain, noiseBuf, muted = false, speaking = false;
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
const PENTA = [60, 62, 64, 67, 69, 72, 74, 76, 79, 81];

function initAudio() {
  unlockVoice();
  if (ctx || !AC) { if (ctx && ctx.state === 'suspended') ctx.resume(); return; }
  ctx = new AC();
  master = ctx.createGain(); master.gain.value = .9; master.connect(ctx.destination);
  musicGain = ctx.createGain(); musicGain.gain.value = muted ? 0 : .22; musicGain.connect(master);
  sfxGain = ctx.createGain(); sfxGain.gain.value = .55; sfxGain.connect(master);
  noiseBuf = ctx.createBuffer(1, ctx.sampleRate * .3, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  startMusic();
}
function env(g, t, a, peak, dec) { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + dec); }
function marimba(m, t, vol, dest) {
  const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), g2 = ctx.createGain();
  o.frequency.value = mf(m); o2.frequency.value = mf(m) * 4; g2.gain.value = .12;
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(dest || musicGain);
  env(g, t, .006, vol, .42); o.start(t); o2.start(t); o.stop(t + .5); o2.stop(t + .5);
}
function pluck(m, t, vol, dur, type, dest) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type || 'triangle'; o.frequency.value = mf(m); o.connect(g); g.connect(dest || musicGain);
  env(g, t, .008, vol, dur || .2); o.start(t); o.stop(t + (dur || .2) + .05);
}
function noise(t, vol, hp, dur, dest) {
  const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp || 6000;
  s.connect(f); f.connect(g); g.connect(dest || musicGain); env(g, t, .002, vol, dur || .05); s.start(t); s.stop(t + .3);
}
function kick(t) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(45, t + .12);
  o.connect(g); g.connect(musicGain); env(g, t, .004, .35, .16); o.start(t); o.stop(t + .25);
}
/* Do - La menor - Fa - Sol, 116 bpm, ritmo de ukelele y marimba */
const BPM = 116, STEP = 60 / BPM / 2;
const CHORDS = [[48, 52, 55], [45, 48, 52], [41, 45, 48], [43, 47, 50]];
const MEL = [
  [76, 0, 79, 0, 76, 74, 72, 0],
  [72, 0, 76, 0, 81, 79, 76, 0],
  [77, 0, 74, 0, 72, 69, 72, 0],
  [74, 0, 79, 0, 76, 74, 71, 0]
];
let nextT = 0, step = 0, musicTimer = null;
function startMusic() { nextT = ctx.currentTime + .15; step = 0; musicTimer = setInterval(sched, 30); }
function sched() { while (nextT < ctx.currentTime + .15) { playStep(step, nextT); nextT += STEP; step = (step + 1) % 32; } }
function playStep(s, t) {
  const bar = Math.floor(s / 8), k = s % 8, ch = CHORDS[bar];
  if (k === 0 || k === 4) { pluck(ch[0], t, .5, .32, 'sine'); kick(t); }
  if (k === 2 || k === 6) ch.forEach((m, i) => pluck(m + 12, t + i * .012, .11, .2));
  const mm = MEL[bar][k]; if (mm) marimba(mm, t, .3);
  noise(t, k % 2 ? .05 : .025);
  if (k % 2 === 0) setTimeout(beatPulse, Math.max(0, (t - ctx.currentTime) * 1000));
}
function beatPulse() { const r = document.querySelector('.ring'); if (!r) return; r.classList.remove('b'); void r.offsetWidth; r.classList.add('b'); }
function duck(on) { if (!ctx) return; musicGain.gain.setTargetAtTime(muted ? 0 : (on ? .08 : .22), ctx.currentTime, .06); }

const sfx = {
  ok() { if (!ctx) return; const t = ctx.currentTime; [72, 76, 79, 84].forEach((m, i) => marimba(m, t + i * .09, .45, sfxGain)); },
  oops() { if (!ctx) return; const t = ctx.currentTime; pluck(62, t, .28, .25, 'sine', sfxGain); pluck(58, t + .14, .25, .3, 'sine', sfxGain); },
  pop() { if (!ctx) return; const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(380, t); o.frequency.exponentialRampToValueAtTime(900, t + .09); o.connect(g); g.connect(sfxGain); env(g, t, .004, .4, .1); o.start(t); o.stop(t + .2); },
  step(n) { if (!ctx) return; marimba(PENTA[Math.min(n - 1, 9)], ctx.currentTime, .55, sfxGain); },
  tap(i) { if (!ctx) return; marimba(PENTA[i % PENTA.length], ctx.currentTime, .6, sfxGain); },
  crack() { if (!ctx) return; const t = ctx.currentTime; noise(t, .5, 1500, .08, sfxGain); noise(t + .12, .4, 2500, .06, sfxGain); },
  roar() { /* rugido gracioso, no asustador */
    if (!ctx) return; const t = ctx.currentTime;
    const o = ctx.createOscillator(), lfo = ctx.createOscillator(), lg = ctx.createGain(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(260, t); o.frequency.exponentialRampToValueAtTime(140, t + .25); o.frequency.exponentialRampToValueAtTime(330, t + .55);
    lfo.frequency.value = 22; lg.gain.value = 28; lfo.connect(lg); lg.connect(o.frequency);
    f.type = 'lowpass'; f.frequency.value = 900; o.connect(f); f.connect(g); g.connect(sfxGain);
    env(g, t, .03, .3, .55); o.start(t); lfo.start(t); o.stop(t + .7); lfo.stop(t + .7);
  }
};

/* =====================  voz del dino  ===================== */
let voice = null, speakTok = 0;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => /^es/i.test(v.lang));
  /* Para probar una voz concreta: agregar ?voz=catalina (parte del nombre) al final de la dirección */
  const want = (new URLSearchParams(location.search).get('voz') || '').toLowerCase();
  if (want) { const f = vs.find(v => v.name.toLowerCase().includes(want)); if (f) { voice = f; return; } }
  const score = v => {
    const n = v.name.toLowerCase(); let s = 0;
    if (/natural|neural|online/.test(n)) s += 50;

function lettersOf(name) {
  const out = [];
  for (const ch of name.toUpperCase()) {
    if (ch === 'Ñ') { out.push('Ñ'); continue; }
    const b = ch.normalize('NFD')[0];
    if (/[A-Z]/.test(b)) out.push(b);
  }
  return out;
}
function cleanName(s) {
  s = (s || '').replace(/[^\p{L}\s'-]/gu, '').replace(/\s+/g, ' ').trim().slice(0, 14);
  return s.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
}
function parseSpoken(t) {
  t = (t || '').toLowerCase().replace(/[.,!?¡¿]/g, ' ').replace(/\s+/g, ' ').trim();
  const m = t.match(/(?:me llamo|mi nombre es|yo soy|soy|me dicen)\s+(.+)/);
  if (m) t = m[1];
  const first = t.split(' ')[0];
  const n = cleanName(first);
  return n.length ? n : null;
}

/* =====================  efectos visuales  ===================== */
function confetti() {
  const fx = $('#fx'), em = ['🦕', '⭐', '🎉', '✨', '🥚', '🦖', '💚', '🎈'];
  for (let i = 0; i < 34; i++) {
    const s = document.createElement('span'); s.className = 'fxp'; s.textContent = rand(em);
    s.style.left = Math.random() * 96 + 'vw'; s.style.animationDuration = 1.8 + Math.random() * 1.6 + 's'; s.style.animationDelay = Math.random() * .5 + 's';
    fx.appendChild(s); setTimeout(() => s.remove(), 4200);
  }
}
function floatNote(x, y) {
  const s = document.createElement('span'); s.className = 'note'; s.textContent = rand(['♪', '♫', '⭐', '✨']);
  s.style.left = x - 14 + 'px'; s.style.top = y - 20 + 'px'; $('#fx').appendChild(s); setTimeout(() => s.remove(), 1100);
}

/* =====================  navegación  ===================== */
function startView(name, hud) {
  token++; clearTimeout(idleT); view = name; repeatFn = null;
  stopVoice();
  $('#fx').innerHTML = '';
  $('#btnHome').hidden = !(hud && hud.home);
  $('#btnRepeat').hidden = !(hud && hud.repeat);
  return token;
}
function idle(fn, ms) { clearTimeout(idleT); idleT = setTimeout(fn, ms || 9000); }
$('#btnHome').onclick = () => { sfx.pop(); renderMap(); };
$('#btnRepeat').onclick = () => { if (repeatFn) repeatFn(); };
$('#btnMusic').onclick = () => {
  initAudio(); muted = !muted; $('#btnMusic').textContent = muted ? '🔇' : '🎵';
  if (ctx) musicGain.gain.setTargetAtTime(muted ? 0 : .22, ctx.currentTime, .05);
};
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stopVoice(); if (ctx) ctx.suspend(); }
  else if (ctx) ctx.resume();
});

/* =====================  1. inicio  ===================== */
function renderStart() {
  startView('start', { home: false, repeat: false });
  stage.innerHTML = `<div class="start" style="display:flex;flex-direction:column;align-items:center;gap:4vmin">
    <div class="coach bounce">${dinoSVG(S.col)}</div>
    <button class="bigbtn" id="bPlay" aria-label="Jugar">▶</button></div>`;
  $('#bPlay').onclick = async () => {
    initAudio(); sfx.roar();
    renderIntro();
  };
}

/* =====================  intro: saludo y explicación  ===================== */
function renderIntro() {
  const g = startView('intro', { home: false, repeat: true });
  repeatFn = () => say(`¡Hola, ${S.name}!`, '#hola_rexi', '#explica');
  stage.innerHTML = `<div class="row" style="gap:4vmin;flex-wrap:nowrap"><div class="coach bounce" style="width:min(40vmin,260px)">${dinoSVG(S.col)}</div><div class="mapEgg bounce" style="width:min(26vmin,180px)">${eggSVG(0)}</div></div>${tilesHTML(S.name)}
    <button class="bigbtn ok" id="bGo" aria-label="Seguir">▶</button>`;
  $('#bGo').onclick = () => { sfx.pop(); renderPickDino(); };
  (async () => { await repeatFn(); if (g !== token) return; await sleep(400); if (g === token) renderPickDino(); })();
}

/* =====================  3. elegir dino (4 avatares)  ===================== */
function renderPickDino(greet) {
  startView('pick', { home: false, repeat: true });
  repeatFn = () => say('#elige_dino');
  stage.innerHTML = `<div class="pickrow">${DINOS.map((d, i) => `<button class="pick" data-i="${i}" aria-label="Dino ${d.name}"><img class="avimg" src="${d.img}" alt="" draggable="false"></button>`).join('')}</div>`;
  if (greet) say('#hola_rexi', '#elige_dino'); else repeatFn();
  stage.querySelectorAll('[data-i]').forEach(b => b.onclick = async () => {
    S.av = +b.dataset.i; S.col = Object.assign({}, DINOS[S.av].col); sfx.ok(); b.classList.add('good');
    stage.querySelectorAll('[data-i]').forEach(x => x.onclick = null);
    const g = token; await say('#lindo_dino');
    if (g !== token) return; renderMap();
  });
}

/* =====================  4. mapa de misiones  ===================== */
const MIS_ICON = ['<span>Aa</span>', '🥚', '🎨', '🐾', '🌰'];
function renderMap() {
  const g = startView('map', { home: false, repeat: true });
  const nd = S.done.filter(Boolean).length;
  repeatFn = () => say(nd === 0 ? '#elige_mision' : '#elige_otra');
  stage.innerHTML = `<div class="map"><div class="mapTop"><div class="mapEgg ${nd ? '' : 'bounce'}">${eggSVG(nd)}</div>${avHTML('mapAv')}</div>
    <div class="missions">${MIS_ICON.map((ic, i) => `<button class="mis m${i + 1} ${S.done[i] ? 'done' : ''}" data-m="${i}" aria-label="Misión ${i + 1}">${ic}${S.done[i] ? '<span class="star">⭐</span>' : ''}</button>`).join('')}</div></div>`;
  repeatFn();
  stage.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { sfx.pop(); startMission(+b.dataset.m); });
}
function startMission(i) {
  const g = startView('mission', { home: true, repeat: true });
  [m1, m2, m3, m4, m5][i](g).then(ok => { if (ok && g === token) finishMission(i, g); });
}
async function finishMission(i, g) {
  S.done[i] = true; confetti(); sfx.ok();
  await say('#' + rand(PRAISE_IDS));
  if (g !== token) return; await sleep(400); if (g !== token) return;
  if (S.done.every(Boolean)) renderFinale(); else renderMap();
}

/* =====================  misión 1: busca la letra  ===================== */
function pickTargets(n) {
  const first = S.letters[0], rest = shuffle([...new Set(S.letters)].filter(l => l !== first));
  const out = [first, ...rest].slice(0, n), pool = shuffle(COMMON.filter(l => !out.includes(l)));
  while (out.length < n) out.push(pool.pop());
  return out;
}
function distract(t, k) {
  const bad = CONF[t] || new Set();
  let pool = shuffle(COMMON.filter(l => l !== t && !bad.has(l)));
  return pool.slice(0, k);
}
async function m1(g) {
  const targets = pickTargets(3); let prevErr = 0;
  for (let r = 0; r < 3; r++) {
    const t = targets[r], nopt = (r === 0 || prevErr > 0) ? 2 : 3;
    const opts = shuffle([t, ...distract(t, nopt - 1)]);
    stage.innerHTML = `<div class="bubble"><span class="bigLetter">${t}</span><span class="emo" id="emo"></span></div>
      <div class="eggs">${opts.map(o => `<button class="egg" data-l="${o}" style="background:radial-gradient(circle at 32% 24%,#fff9 0 11%,transparent 12%),hsl(${(o.charCodeAt(0) * 47) % 360} 80% 80%)">${o}</button>`).join('')}</div>${dotsHTML(r, 3)}`;
    repeatFn = () => say('#busco_' + lid(t));
    repeatFn();
    const hint = () => { const c = stage.querySelector(`.egg[data-l="${t}"]`); if (c) c.classList.add('hint'); };
    idle(() => { hint(); say('#cual_' + lid(t)); }, 10000);
    let errors = 0, locked = false;
    await new Promise(res => {
      stage.querySelectorAll('.egg').forEach(b => b.onclick = async () => {
        if (locked || g !== token) return;
        clearTimeout(idleT);
        if (b.dataset.l === t) {
          locked = true; b.classList.remove('hint'); b.classList.add('good'); sfx.ok();
          $('#emo').textContent = WORD[t][1];
          await say('#ok_' + lid(t));
          await sleep(350); res();
        } else {
          errors++; b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad'); sfx.oops();
          say('#' + rand(OOPS_IDS)); if (errors >= 2) hint();
          idle(() => { hint(); say('#cual_' + lid(t)); }, 10000);
        }
      });
    });
    if (g !== token) return false;
    prevErr = errors;
  }
  return true;
}

/* =====================  misión 2: cuenta huevos (arrastrar o tocar)  ===================== */
async function m2(g) {
  const ns = [2, 3, 5];
  for (let r = 0; r < 3; r++) {
    const n = ns[r];
    stage.innerHTML = `<div class="bubble"><span class="bigNum">${n}</span><span class="dotsRow">${'●'.repeat(n)}</span></div>
      <div class="field" id="field"><div class="nest" id="nest">${nestSVG}</div></div>${dotsHTML(r, 3)}`;
    repeatFn = () => say('#pon_' + n);
    repeatFn();
    await sleep(60); if (g !== token) return false;
    const field = $('#field'), nest = $('#nest'), fr = field.getBoundingClientRect();
    const total = n + 2, esz = Math.max(46, Math.min(fr.width / (total + .6), fr.height * .24, 110)), eh = esz * 1.25;
    const eggs = [];
    for (let i = 0; i < total; i++) {
      const el = document.createElement('div'); el.className = 'cegg';
      el.style.width = esz + 'px'; el.style.height = eh + 'px';
      el.style.left = (fr.width / total * (i + .5) - esz / 2) + 'px'; el.style.top = (fr.height - eh - 6) + 'px';
      el.style.background = `hsl(${(i * 67 + 90) % 360} 75% 80%)`;
      field.appendChild(el); eggs.push(el);
    }
    let placed = 0, finished = false;
    const slotPos = k => {
      const nr = nest.getBoundingClientRect(), f = field.getBoundingClientRect();
      const cx = nr.left + nr.width / 2 - f.left, cy = nr.top + nr.height * .45 - f.top;
      const dx = [-1, 0, 1, -.5, .5][k] * nr.width * .2, dy = [0, 0, 0, -.55, -.55][k] * eh * .7;
      return { x: cx + dx - esz / 2, y: cy + dy - eh / 2 };
    };
    const nextHint = () => { const e = eggs.find(x => !x.dataset.placed); if (e) e.classList.add('hint'); };
    await new Promise(res => {
      const place = el => {
        if (finished || el.dataset.placed) return;
        el.dataset.placed = 1; el.classList.remove('hint'); placed++;
        const p = slotPos(placed - 1); el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
        sfx.step(placed); say('#n_' + placed);
        clearTimeout(idleT); idle(() => { nextHint(); say('#toca_huevo'); }, 8000);
        if (placed >= n) { finished = true; eggs.forEach(x => { if (!x.dataset.placed) x.classList.add('gone'); }); setTimeout(res, 900); }
      };
      eggs.forEach(el => {
        el.onpointerdown = e => {
          if (el.dataset.placed || finished) return;
          el.setPointerCapture(e.pointerId);
          const sx = e.clientX, sy = e.clientY, ox = parseFloat(el.style.left), oy = parseFloat(el.style.top); let moved = false;
          el.classList.add('drag'); el.style.transition = 'none';
          el.onpointermove = ev => { const dx = ev.clientX - sx, dy = ev.clientY - sy; if (Math.hypot(dx, dy) > 8) moved = true; el.style.left = ox + dx + 'px'; el.style.top = oy + dy + 'px'; };
          el.onpointerup = ev => {
            el.onpointermove = el.onpointerup = null; el.classList.remove('drag'); el.style.transition = '';
            const er = el.getBoundingClientRect(), nr = nest.getBoundingClientRect(), cx = er.left + er.width / 2, cy = er.top + er.height / 2;
            const inNest = cx > nr.left - 24 && cx < nr.right + 24 && cy > nr.top - 24 && cy < nr.bottom + 36;
            if (!moved || inNest) place(el); else { el.style.left = ox + 'px'; el.style.top = oy + 'px'; }
          };
          el.onpointercancel = () => { el.onpointermove = el.onpointerup = null; el.classList.remove('drag'); el.style.transition = ''; el.style.left = ox + 'px'; el.style.top = oy + 'px'; };
        };
      });
      idle(() => { nextHint(); say('#toca_huevo'); }, 8000);
    });
    if (g !== token) return false;
    sfx.ok(); await say('#contaste_' + n); await sleep(300);
    if (g !== token) return false;
  }
  return true;
}

/* =====================  misión 3: pinta al dino (dibujo SVG por partes)  ===================== */
async function m3(g) {
  const col = Object.assign({}, S.col); let sel = 0; const painted = new Set();
  stage.innerHTML = `<div class="paint">${dinoSVG(col, 'paintDino')}
    <div class="palette">${PAL.map((p, i) => `<button class="sw ${i === 0 ? 'sel' : ''}" data-c="${i}" style="background:${p[0]}" aria-label="${p[1]}"></button>`).join('')}</div>
    <button class="bigbtn ok" id="bDone" hidden aria-label="Listo">✅</button></div>`;
  repeatFn = () => say('#pinta_intro');
  repeatFn();
  idle(() => say('#toca_pintar'), 9000);
  const svg = stage.querySelector('svg.dino');
  return new Promise(res => {
    let done = false;
    const finish = () => { if (done) return; done = true; Object.assign(S.col, col); setTimeout(() => res(g === token), 500); };
    stage.querySelectorAll('.sw').forEach(b => b.onclick = () => {
      sel = +b.dataset.c; stage.querySelectorAll('.sw').forEach(x => x.classList.toggle('sel', x === b));
      sfx.pop(); say('#c_' + PAL[sel][1]); clearTimeout(idleT);
    });
    svg.addEventListener('click', e => {
      const el = e.target.closest('[data-part]'); if (!el || done) return;
      const part = el.dataset.part; col[part] = PAL[sel][0]; svg.style.setProperty('--' + part, PAL[sel][0]);
      svg.querySelectorAll(`[data-part="${part}"]`).forEach(x => { x.classList.remove('paintpop'); void x.getBoundingClientRect(); x.classList.add('paintpop'); });
      sfx.pop(); painted.add(part); clearTimeout(idleT);
      if (painted.size === 1) { $('#bDone').hidden = false; say('#que_lindo'); }
      if (painted.size >= 3) { say('#precioso'); finish(); }
      else idle(() => say('#pinta_otra'), 9000);
    });
    $('#bDone').onclick = () => { sfx.ok(); finish(); };
  });
}

/* =====================  misión 4: huellas (patrones)  ===================== */
const FC = { g: '#3fae5a', r: '#ff5c5c', b: '#4aa8ff', y: '#ffb830' };
const it = (s, c) => ({ s, c: FC[c || 'g'] });
const same = (a, b) => a.s === b.s && a.c === b.c;
const P_ROUNDS = [
  { seq: [it('g'), it('p'), it('g')], ans: it('p'), opts: [it('g'), it('p')] },
  { seq: [it('g', 'r'), it('g', 'b'), it('g', 'r')], ans: it('g', 'b'), opts: [it('g', 'r'), it('g', 'b'), it('g', 'y')] },
  { seq: [it('g', 'b'), it('g', 'b'), it('p', 'b'), it('g', 'b'), it('g', 'b')], ans: it('p', 'b'), opts: [it('g', 'b'), it('p', 'b'), it('p', 'r')] }
];
async function m4(g) {
  for (let r = 0; r < 3; r++) {
    const R = P_ROUNDS[r], opts = shuffle(R.opts);
    stage.innerHTML = `<div class="seq">${R.seq.map(o => `<div class="cell">${footSVG(o)}</div>`).join('')}<div class="cell q" id="q">?</div></div>
      <div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}">${footSVG(o)}</button>`).join('')}</div>${dotsHTML(r, 3)}`;
    repeatFn = () => say('#que_huella');
    repeatFn();
    const hint = () => { const b = [...stage.querySelectorAll('.opt')].find(x => same(opts[+x.dataset.i], R.ans)); if (b) b.classList.add('hint'); };
    idle(() => { hint(); say('#cual_huella'); }, 10000);
    let errors = 0, locked = false;
    await new Promise(res => {
      stage.querySelectorAll('.opt').forEach(b => b.onclick = async () => {
        if (locked || g !== token) return; clearTimeout(idleT);
        if (same(opts[+b.dataset.i], R.ans)) {
          locked = true; b.classList.remove('hint'); b.classList.add('good'); sfx.ok();
          $('#q').classList.remove('q'); $('#q').innerHTML = footSVG(R.ans);
          await say('#esa_huella'); await sleep(350); res();
        } else {
          errors++; b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad'); sfx.oops(); say('#' + rand(OOPS_IDS)); if (errors >= 2) hint();
          idle(() => { hint(); say('#cual_huella'); }, 10000);
        }
      });
    });
    if (g !== token) return false;
  }
  return true;
}

/* =====================  misión 5: aplasta las semillas que caen (no se puede perder)  ===================== */
const seedSVG = `<svg viewBox="0 0 60 80"><path d="M30 4 C48 18 54 44 30 76 C6 44 12 18 30 4Z" fill="#8a5a2b" stroke="#4a2a10" stroke-width="3" stroke-linejoin="round"/><path d="M30 14 C38 30 38 50 30 66" stroke="#e6c08a" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="22" cy="28" rx="4" ry="7" fill="#fff" opacity=".35"/></svg>`;
async function m5(g) {
  const N = 8; let taps = 0;
  stage.innerHTML = `<div class="stars">${'<span>⭐</span>'.repeat(N)}</div><div class="seedfield" id="sf"></div>`;
  repeatFn = () => say('#semillas_intro');
  repeatFn();
  idle(() => say('#toca_semilla'), 8000);
  const sf = $('#sf'), stars = stage.querySelectorAll('.stars span');
  await sleep(60); if (g !== token) return false;
  const fr = sf.getBoundingClientRect(), H = fr.height, W = fr.width;
  const sz = Math.max(60, Math.min(W, H) * .17);
  return new Promise(res => {
    let done = false, timer = null;
    const live = () => [...sf.querySelectorAll('.seed:not(.hit)')];
    const spawn = () => {
      if (done || g !== token) { clearInterval(timer); return; }
      if (live().length >= 4) return;
      const el = document.createElement('div'); el.className = 'seed';
      el.style.width = sz + 'px'; el.style.height = sz * 1.3 + 'px';
      el.style.left = (W * .04 + Math.random() * (W * .92 - sz)) + 'px';
      el.style.setProperty('--h', (H + sz) + 'px'); el.style.setProperty('--s', sz + 'px');
      el.style.animationDuration = (4.4 + Math.random() * 1.8) + 's';
      el.innerHTML = `<div class="seedIn">${seedSVG}</div>`;
      el.addEventListener('animationend', () => el.remove());
      sf.appendChild(el);
    };
    const squash = (el, x, y) => {
      el.classList.add('hit'); taps++; sfx.step(taps); floatNote(x, y);
      stars[Math.min(taps, N) - 1].classList.add('on');
      setTimeout(() => el.remove(), 420);
      clearTimeout(idleT); idle(() => say('#toca_semilla'), 8000);
      if (taps >= N && !done) {
        done = true; clearInterval(timer); clearTimeout(idleT);
        live().forEach(s => { s.style.transition = 'opacity .4s'; s.style.opacity = 0; });
        setTimeout(() => { sfx.roar(); res(g === token); }, 700);
      }
    };
    sf.onpointerdown = e => {
      if (done) return;
      let best = null, bd = Math.max(sz * .95, 70);
      live().forEach(s => { const r = s.getBoundingClientRect(), d = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2)); if (d < bd) { bd = d; best = s; } });
      if (best) squash(best, e.clientX, e.clientY);
    };
    spawn(); timer = setInterval(spawn, 850);
  });
}

/* =====================  final: nace el dino  ===================== */
async function renderFinale() {
  const g = startView('finale', { home: false, repeat: false });
  stage.innerHTML = `<div class="hatch" id="hatch"><div class="bigEgg"><div class="wob">${eggSVG(5)}</div></div></div>`;
  await say(`¡${S.name}!`, '#huevo_mueve');
  if (g !== token) return;
  sfx.crack(); await sleep(700); if (g !== token) return; sfx.crack(); await sleep(800); if (g !== token) return;
  sfx.roar(); confetti();
  $('#hatch').innerHTML = `${avHTML('baby bounce')}<div class="shell">${shellSVG}</div>${tilesHTML(S.name)}`;
  await say(`¡${S.name}!`, '#hola_amigo');
  if (g !== token) return;
  const again = document.createElement('button');
  again.className = 'bigbtn'; again.textContent = '🔄'; again.setAttribute('aria-label', 'Jugar otra vez');
  again.onclick = () => { sfx.pop(); S.done = [false, false, false, false, false]; renderMap(); };
  stage.appendChild(again);
}

renderStart();
